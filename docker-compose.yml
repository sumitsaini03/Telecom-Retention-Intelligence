services:
  postgres:
    image: postgres:16
    container_name: telecom-retention-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telco}
      POSTGRES_USER: ${POSTGRES_USER:-telco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}
    ports:
      - "127.0.0.1:${TELCO_PG_PORT:-55432}:5432"
    volumes:
      - telecom-retention-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telco} -d ${POSTGRES_DB:-telco}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  telecom-retention-postgres-data:
